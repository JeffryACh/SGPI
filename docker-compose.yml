name: sgpi

services:
  backend:
    build: ./backend
    container_name: sgpi-backend
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      DOMINIOS_CORREO_PERMITIDOS: ${DOMINIOS_CORREO_PERMITIDOS:-tec.ac.cr}
      PASSWORD_DEMO: ${PASSWORD_DEMO:-}
      MODO_DEMO: ${MODO_DEMO:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@tec.ac.cr}
      SMTP_TLS: ${SMTP_TLS:-1}
    ports:
      - "3001:3000"

  frontend:
    image: nginx:alpine
    container_name: sgpi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  sgpi_pgdata:

<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SGPI · VIE — Prototipo interactivo</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/usability.css">
  <link rel="stylesheet" href="../css/branding.css">
  <link rel="stylesheet" href="../css/notifications.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <!-- API URL configuration - set via environment variable in Vercel/Render.
       In Docker/nginx (port 8080), we use relative paths so nginx proxy handles routing. -->
  <script>
    // Set API URL from meta tag or environment variable, but only for Vercel/Render
    // In Docker/nginx (port 8080), we use relative paths so nginx proxy handles routing
    (function() {
      var isDockerNginx = window.location.port === "8080" || window.location.port === "80";
      var isVercel = window.location.hostname.includes(".vercel.app");
      
      if (!isDockerNginx && !isVercel) {
        // Local development - use local backend
        window.SGPI_API_URL = "http://localhost:3001";
      } else if (isVercel) {
        // Vercel - use meta tag or env var for Render backend
        var meta = document.querySelector('meta[name="sgpi-api-url"]');
        window.SGPI_API_URL = meta ? meta.content : 'https://sgpi-backend-api.onrender.com';
        if (typeof __SGPI_API_URL__ !== 'undefined') {
          window.SGPI_API_URL = __SGPI_API_URL__;
        }
      }
      // In Docker/nginx, we use relative paths (empty string) so nginx proxy handles routing
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="../js/content.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/ethics.js"></script>
  <script src="../js/notifications.js"></script>
</body>

</html>

server {
    listen 80;
    root /usr/share/nginx/html;
    index html/SGPI.html;

    sendfile off;
    add_header Cache-Control "no-store";

    # Proxy API requests to backend - single regex location for all API paths
    location ~ ^/(auth|propuestas|modalidades|escuelas|lineas_de_investigacion|convocatorias|catalogos|ia|admin|notificaciones)(/|$) {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}